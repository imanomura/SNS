<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新規会員登録 | Sanctuary</title>
    <link href="style.css" rel="stylesheet" />
    <script src="https://unpkg.com/petite-vue" defer init></script>
  </head>
  <body>
    <div v-scope="Registraapp()" class="auth-container">
      <div class="auth-card">
        <h2>新規会員登録</h2>
        <p class="auth-subtitle">自分だけの静かな場所を作りましょう</p>

        <form @submit.prevent="submitData">
          <div class="form-group">
            <label>ユーザー名</label>
            <input type="text" v-model="username" placeholder="あなたの名前" />
          </div>

          <div class="form-group">
            <label>メールアドレス</label>
            <input type="email" v-model="email" placeholder="example@mail.com" />
          </div>

          <div class="form-group">
            <label>パスワード</label>
            <input type="password" v-model="password" placeholder="パスワード" />
          </div>

          <div class="form-group">
            <label>生年月日</label>
            <input type="date" v-model="HB" />
          </div>

          <div class="form-group">
            <label>プロフィール画像</label>
            <div class="file-input-wrapper">
              <input type="file" accept=".png, .jpg, .jpeg" @change="onFileChange" id="file-upload" />
              <label for="file-upload" class="file-label">画像を選択</label>
            </div>
            <div class="image-preview" v-if="uploadImage">
              <img :src="uploadImage" />
            </div>
          </div>

          <button type="submit" class="submit-btn">登録する</button>
        </form>

        <div class="auth-footer">
          <p>既にアカウントをお持ちの方は<a href="/login.html">こちら</a></p>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
