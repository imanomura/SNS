<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="style.css" rel="stylesheet" />
    <script src="https://unpkg.com/petite-vue" defer init></script>
  </head>
  <body>
    <div v-scope="PostApp()" @vue:mounted="mounted">
      <p>投稿画面</p>
      <div style="margin: 10px 0">
        <label style="display: flex; align-items: center; cursor: pointer">
          <input type="checkbox" v-model="isPrivate" style="margin-right: 5px; transform: scale(1.2)" />
          🔒 じぶんだけ（非公開）にする
        </label>
      </div>
      <div style="margin: 15px 0; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #fff">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold">
          <input type="checkbox" v-model="isBlurred" style="width: 18px; height: 18px" />
          内容をぼかして投稿する（閲覧注意）
        </label>

        <div v-if="isBlurred" style="margin-top: 10px">
          <p style="font-size: 0.8em; color: #666; margin-bottom: 5px">
            表示する注意書き（例：ネタバレ注意、愚痴など）
          </p>
          <input
            type="text"
            v-model="warningText"
            placeholder="閲覧注意"
            style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px"
          />
        </div>
      </div>
      <button @click.prevent="gohome">投稿をやめる</button>
      <button @click.prevent="post">投稿</button>
      <div
        v-if="parentPost"
        style="background: #f0f0f0; padding: 10px; border-radius: 5px; margin-bottom: 10px; border-left: 4px solid #888"
      >
        <small>返信先: <b>{{ parentPost.displayName }}</b></small>
        <p style="color: #555; font-size: 0.9em; margin: 5px 0">{{ parentPost.content }}</p>
      </div>

      <div id="Post">
        <textarea v-model="postContent" placeholder="いまどうしてる？"></textarea>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
