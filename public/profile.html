<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プロフィール画面</title>
    <link href="style.css" rel="stylesheet" />
    <script src="https://unpkg.com/petite-vue" defer init></script>
  </head>
  <body>
    <div v-scope="ProfileApp()" @vue:mounted="mounted" style="max-width: 600px; margin: 0 auto; padding: 20px">
      <div v-if="!isEditing">
        <div style="text-align: center; margin-bottom: 20px">
          <img
            v-if="image"
            :src="image"
            style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #ddd"
          />
          <div
            v-else
            style="
              width: 100px;
              height: 100px;
              background: #ccc;
              border-radius: 50%;
              margin: 0 auto;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 2em;
              font-weight: bold;
            "
          >
            {{ displayName.charAt(0) }}
          </div>

          <h2>{{ displayName }}</h2>
          <p style="color: gray">@{{ username }}</p>
        </div>

        <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px">
          <p style="font-weight: bold; margin-bottom: 5px">自己紹介</p>
          <p style="white-space: pre-wrap">{{ bio }}</p>
        </div>

        <button v-if="isMe" @click="startEdit" style="width: 100%; padding: 10px; margin-bottom: 10px">
          プロフィールを編集
        </button>
        <button @click.prevent="gohome" style="width: 100%; padding: 10px; background: #eee; border: none">
          ホームに戻る
        </button>
      </div>

      <div v-if="isEditing" style="background: white; border: 1px solid #ddd; padding: 20px; border-radius: 8px">
        <h3>プロフィール編集</h3>

        <div style="margin-bottom: 15px">
          <label>プロフィール画像</label><br />
          <img
            v-if="previewImage"
            :src="previewImage"
            style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin: 5px 0"
          />
          <input type="file" @change="onFileChange" accept="image/*" />
        </div>

        <div style="margin-bottom: 15px">
          <label>表示名（ユーザーネーム）</label>
          <input type="text" v-model="editName" style="width: 100%; padding: 8px; margin-top: 5px" />
        </div>

        <div style="margin-bottom: 15px">
          <label>自己紹介</label>
          <textarea v-model="editBio" style="width: 100%; height: 80px; padding: 8px; margin-top: 5px"></textarea>
        </div>

        <div style="display: flex; gap: 10px">
          <button
            @click="saveProfile"
            style="flex: 1; background: #333; color: white; padding: 10px; border: none; border-radius: 4px"
          >
            保存
          </button>
          <button
            @click="cancelEdit"
            style="flex: 1; background: #ccc; border: none; padding: 10px; border-radius: 4px"
          >
            キャンセル
          </button>
        </div>
      </div>

      <hr style="margin: 30px 0" />

      <h3>{{ displayName }} の投稿一覧</h3>
      <div v-if="posts.length === 0">投稿はまだありません</div>

      <div
        v-for="post in posts"
        :key="post.id"
        style="border-bottom: 1px solid #eee; padding: 10px 0; display: flex; gap: 10px"
      >
        <img
          v-if="post.userImage"
          :src="post.userImage"
          style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover"
        />
        <div v-else style="width: 40px; height: 40px; background: #ccc; border-radius: 50%"></div>

        <div>
          <div style="font-weight: bold">{{ post.displayName }}</div>
          <div>{{ post.content }}</div>
          <small style="color: gray">{{ new Date(post.createdAt).toLocaleString() }}</small>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
